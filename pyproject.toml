[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"


[project]
name = "django-task-calendar"
version = "0.1.5.1"
description = "Reusable task diaries for Django applications"
readme = "README.md"
dependencies = [
    "Django==5.0",
]
requires-python = ">=3.12"
license = "GPL-3.0-or-later"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["Diary", "Diary.*"]
exclude = ["Diary.tests", "Diary.tests.*"]
namespaces = false

[tool.setuptools.package-data]
Diary = [
    "templates/Diary/*.html",
    "templates/Diary/partials/*.html",
    "static/Diary/styles/*.css",
    "static/Diary/scripts/*.js",
]
